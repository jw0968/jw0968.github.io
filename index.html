<style>
  :root {
    --ink: #07090f;
    --surface: rgba(13, 17, 28, 0.86);
    --surface-solid: #0d111c;
    --text: #e8ebf3;
    --muted: #8d95aa;
    --faint: #59617a;
    --line: rgba(196, 206, 236, 0.12);
    --line-strong: rgba(196, 206, 236, 0.22);
    --accent: #ffb84d;
    --display: 'Syne', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
    --body: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.55;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(46, 60, 110, 0.35), transparent 70%),
      var(--ink);
  }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.hovering { cursor: pointer; }
  #stage canvas.dragging { cursor: grabbing; }

  /* ---------- chrome ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 24px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    pointer-events: none; z-index: 5;
  }
  .topbar > * { pointer-events: auto; }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 {
    font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em;
    margin: 0; line-height: 1.1;
  }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .topright { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .hint {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); text-align: right; max-width: 220px; line-height: 1.6;
  }
  .resume-link {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text); text-decoration: none; border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 6px 12px; transition: border-color .15s, background .15s;
  }
  .resume-link:hover, .resume-link:focus-visible { border-color: var(--accent); background: rgba(255,184,77,0.08); outline: none; }
  .inline-link { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .inline-link:hover { border-bottom-color: var(--accent); }

  .index {
    position: fixed; left: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 5; display: flex; flex-direction: column; gap: 2px;
  }
  .index .label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 8px;
  }
  .index button {
    all: unset; cursor: pointer;
    display: grid; grid-template-columns: 10px 1fr; align-items: center; column-gap: 12px;
    padding: 6px 10px 6px 8px; margin-left: -8px; border-radius: 6px;
    color: var(--muted); font-size: 13.5px; transition: color .15s, background .15s;
  }
  .index button .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--c);
    box-shadow: 0 0 0 0 var(--c); transition: box-shadow .2s;
  }
  .index button .name { font-weight: 500; }
  .index button .fn { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: 0.04em; }
  .index button:hover, .index button:focus-visible, .index button.active {
    color: var(--text); background: rgba(255,255,255,0.04);
  }
  .index button.active .dot, .index button:hover .dot { box-shadow: 0 0 12px 2px var(--c); }
  .index button:focus-visible { outline: 1px solid var(--line-strong); outline-offset: 1px; }

  .tooltip {
    position: fixed; z-index: 6; pointer-events: none;
    transform: translate(14px, 14px);
    background: var(--surface); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 8px; padding: 8px 12px 9px;
    opacity: 0; transition: opacity .12s;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-name { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--c); }
  .tooltip .t-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .tooltip .t-sec { font-size: 12.5px; color: var(--text); margin-top: 4px; }

  /* ---------- panel ---------- */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
    z-index: 8; background: var(--surface); border-left: 1px solid var(--line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transform: translateX(104%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel.open { transform: translateX(0); }
  .panel-head {
    padding: 22px 28px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    position: relative;
  }
  .panel-head::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c);
    box-shadow: 0 0 18px var(--c);
  }
  .panel .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c);
  }
  .panel h2 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.01em; margin: 4px 0 0; line-height: 1.1; text-wrap: balance; }
  .panel .why { color: var(--muted); font-size: 13px; margin: 8px 0 0; max-width: 34em; }
  .panel .close {
    all: unset; cursor: pointer; flex: none; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted);
    font-size: 18px; line-height: 1; transition: color .15s, border-color .15s;
  }
  .panel .close:hover, .panel .close:focus-visible { color: var(--text); border-color: var(--line-strong); outline: none; }
  .panel-body { overflow-y: auto; padding: 22px 28px 36px; }
  .panel-body p { margin: 0 0 14px; max-width: 36em; }
  .panel-body p:last-child { margin-bottom: 0; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 22px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 10px; }
  .stat b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--c); font-variant-numeric: tabular-nums; line-height: 1; }
  .stat span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.3; }

  .entries { display: flex; flex-direction: column; margin-top: 6px; }
  .entry { padding: 16px 0; border-top: 1px solid var(--line); }
  .entry:first-child { border-top: 0; padding-top: 4px; }
  .entry .e-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .entry h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 16px; }
  .entry .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: 0.04em; white-space: nowrap; }
  .entry .role { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .entry p { margin: 8px 0 0; font-size: 14px; color: #c9cede; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.03em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; }
  .pill { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }

  .skillgroups { display: grid; gap: 16px; }
  .skillgroup h3 { margin: 0 0 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c); font-weight: 500; }
  .skillgroup .tags { margin-top: 0; }
  .skillgroup .tag.hi { color: var(--text); border-color: var(--line-strong); }

  .contact { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .contact a {
    display: grid; grid-template-columns: 90px 1fr; gap: 12px; align-items: baseline;
    color: var(--text); text-decoration: none; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    transition: border-color .15s, background .15s;
  }
  .contact a:hover, .contact a:focus-visible { border-color: var(--c); background: rgba(255,255,255,0.03); outline: none; }
  .contact a .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .contact a .v { font-size: 14px; word-break: break-all; }
  .note { font-size: 12.5px; color: var(--faint); margin-top: 14px; }

  .scrim { position: fixed; inset: 0; z-index: 7; background: rgba(4,6,12,.35); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.show { opacity: 1; pointer-events: auto; }

  @media (max-width: 720px) {
    .topbar { padding-left: 16px; padding-right: 16px; }
    .hint { display: none; }
    .topright { gap: 0; }
    .index {
      left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      flex-direction: row; overflow-x: auto; padding: 0 16px; gap: 6px; scrollbar-width: none;
    }
    .index::-webkit-scrollbar { display: none; }
    .index .label { display: none; }
    .index button { margin: 0; flex: none; grid-template-columns: 8px auto; column-gap: 8px; padding: 6px 10px; border: 1px solid var(--line); background: var(--surface); }
    .index button .fn { display: none; }
    .panel { top: auto; left: 0; width: 100%; height: 72%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; transform: translateY(104%); }
    .panel.open { transform: translateY(0); }
    .panel-head, .panel-body { padding-left: 20px; padding-right: 20px; }
    .panel-head::before { left: 0; right: 0; top: 0; bottom: auto; width: auto; height: 3px; border-radius: 16px 16px 0 0; }
    .panel h2 { font-size: 24px; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .entry .e-head { flex-direction: column; gap: 2px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .tooltip, .scrim { transition: none; }
  }
</style>
</head>

const REGIONS = [
  {
    key: 'prefrontal', name: 'Prefrontal cortex', fn: 'planning · identity', section: 'About me', color: '#7c9cff',
    why: 'The prefrontal cortex handles planning, goals, and the sense of who you are.',
    html: `
      <p>I'm Jerry, an undergrad at UT Austin studying Neuroscience and Computer Science (B.S., expected May 2028). TAMS alum. I like problems where software meets the body: stroke screening on a phone, health literacy in a pediatric clinic, live data from a neural wearable.</p>
      <div class="stats">
        <div class="stat"><b>2</b><span>peer-reviewed papers (a third in review)</span></div>
        <div class="stat"><b>1</b><span>app deployed in a children's hospital</span></div>
        <div class="stat"><b>2</b><span>YC startups interned at in 2026</span></div>
      </div>
      <p>Most of my production work is native iOS: Swift, SwiftUI, SwiftData, with AWS behind it and LLMs wired in where they earn their place. I've also spent a lot of time on real-time data paths, the part of a system that has to keep working when a stream drops mid-session.</p>
      <p><strong>Where this is heading:</strong> neurotech. Brain-computer interfaces, wearables, and the software layer that turns raw signals into something a person can act on. Also open to any team shipping hard, real-world software.</p>
      <p>The one-page version: <a class="inline-link" href="Jerry_Wang_Resume.pdf" target="_blank" rel="noopener">my resume (PDF)</a>.</p>
    `
  },
  {
    key: 'hippocampus', name: 'Hippocampus', fn: 'memory · encoding', section: 'Projects', color: '#ffb84d',
    why: 'The hippocampus turns experience into long-term memory. These are the things I built and kept.',
    html: entries([
      { t: 'HealthLitPro', m: '2026 · deployed', pill: 'in clinic', p: 'Records patient-clinician conversations on an iPad, transcribes with AWS Transcribe Medical, and scores the clinician on teach-back technique, medical jargon, clarity, and conciseness using a hosted LLM. Live at Children\'s Medical Center Dallas. AWS Signature V4 auth written from scratch in CryptoKit.', tags: ['SwiftUI', 'AVFoundation', 'AWS S3 / IAM', 'Transcribe Medical', 'Llama 3', 'CryptoKit'] },
      { t: 'StrokeSentry', m: '2025 · published', pill: 'IEEE', p: 'Fully on-device FAST stroke screening for iPhone. Vision face landmarks and body pose over a live camera session, facial-asymmetry scoring from left/right landmark deltas, arm-drift detection with per-joint confidence gating, and a speech-clarity model. 42 ms median latency. Nearby-hospital lookup and tap-to-call built in.', tags: ['Swift', 'Vision', 'Speech', 'MapKit', 'Edge AI'] },
      { t: 'SmartNursingHome', m: '2026 · award', pill: 'DFWIT winner', p: 'Privacy-preserving fall detection that runs in the browser. MoveNet pose estimation feeds a three-stage temporal state machine (rapid drop, sustained low posture, cooldown) with an adaptive baseline. Only alarm metadata ever leaves the device. Caregivers get a SwiftUI app on Firebase with per-patient alerts and tap-to-acknowledge.', tags: ['TensorFlow.js', 'MoveNet', 'SwiftUI', 'Firebase'] },
      { t: 'DegreeOptimizer', m: '2026 · built', p: 'Fastest-graduation planner for UT Austin. Enter your AP, IB and dual credit plus a major, and a constraint solver (OR-Tools CP-SAT) returns a semester-by-semester plan that satisfies every degree requirement, respects prerequisites and course-offering patterns, and shows its reasoning for every placement. Requirements are modeled as rule trees with explicit double-count rules. LLMs only parse catalog prose offline, and a human verifies every record before the solver can use it.', tags: ['Next.js', 'TypeScript', 'Postgres', 'Drizzle', 'Python', 'FastAPI', 'OR-Tools'] },
      { t: 'Homeward', m: '2026 · shelved', p: 'An AI care agent for the 30 days after a hospital discharge: medication help, check-ins, escalation to a nurse. SMS and voice, no app. Built the demo, learned more about Medicare transitional-care billing than I expected, and set it aside to focus on internships.', tags: ['TypeScript', 'Next.js', 'Postgres', 'Twilio', 'Inngest'] },
    ])
  },
  {
    key: 'motor', name: 'Motor cortex', fn: 'execution · skill', section: 'Skills & stack', color: '#ff7a59',
    why: 'The motor cortex sends the commands that actually move things. This is what I can execute with.',
    html: `
      <div class="skillgroups">
        <div class="skillgroup"><h3>Languages</h3><div class="tags">${tags(['Swift', 'Python', 'TypeScript / JavaScript', 'C++', 'Java', 'SQL'], ['Swift', 'Python', 'TypeScript / JavaScript'])}</div></div>
        <div class="skillgroup"><h3>iOS (primary)</h3><div class="tags">${tags(['SwiftUI', 'SwiftData', 'AVFoundation', 'Vision', 'Speech', 'HealthKit', 'CryptoKit', 'MapKit', 'XCTest', 'TestFlight'], ['SwiftUI', 'SwiftData', 'AVFoundation'])}</div></div>
        <div class="skillgroup"><h3>AI & ML</h3><div class="tags">${tags(['LLM integration & evaluation', 'PyTorch', 'Hugging Face', 'LoRA fine-tuning', 'RAG', 'TensorFlow.js', 'scikit-learn', 'On-device ML', 'Pose estimation'], ['LLM integration & evaluation', 'LoRA fine-tuning'])}</div></div>
        <div class="skillgroup"><h3>Cloud & data</h3><div class="tags">${tags(['AWS S3', 'IAM', 'Transcribe Medical', 'SigV4', 'Firebase', 'Postgres', 'Drizzle', 'Docker', 'CI/CD'], ['AWS S3'])}</div></div>
        <div class="skillgroup"><h3>Real-time systems</h3><div class="tags">${tags(['Streaming', 'Session lifecycle', 'Buffering & backpressure', 'Reconnection', 'Failure injection', 'Real-device QA rigs'], ['Streaming'])}</div></div>
        <div class="skillgroup"><h3>Web & solvers</h3><div class="tags">${tags(['Next.js', 'Node.js', 'FastAPI', 'OR-Tools CP-SAT', 'Constraint modeling', 'Web scraping'], ['Next.js'])}</div></div>
      </div>
      <p class="note">Bold tags are what I'd bet on in an interview. The rest I've shipped with but wouldn't call myself an expert in.</p>
    `
  },
  {
    key: 'temporal', name: 'Temporal lobe', fn: 'language · hearing', section: 'Publications & research', color: '#4fd1c5',
    why: 'The temporal lobe processes language and sound. Papers are how research gets said out loud.',
    html: entries([
      { t: 'StrokeSentry: edge AI stroke detection from facial asymmetry and speech', m: 'ICBAIE 2025 · IEEE', role: 'First author', p: 'On-device screening on consumer phones, no cloud in the loop. Covers the landmark-based asymmetry metric, the arm-drift algorithm, the speech-clarity model, and latency results.' },
      { t: 'HealthLitPro: LLM-assisted feedback on clinician communication', m: 'IEEE/ACM CHASE 2025', role: 'Co-author', p: 'The app behind the Children\'s Health Dallas deployment: conversation capture, medical transcription, and structured feedback on teach-back and jargon.' },
      { t: 'Third paper', m: '2026 · in review', p: 'Under review. Details once it\'s out.' },
    ]) + `<p class="note">Also: independent researcher since 2025, and an invited applicant to the NSF REU on responsible generative AI at UNT for summer 2027.</p>`
  },
  {
    key: 'parietal', name: 'Parietal lobe', fn: 'senses · space', section: 'Beyond code', color: '#ffd166',
    why: 'The parietal lobe integrates touch, sound, and space. Hands on keys, feet on court.',
    html: `
      <p><strong>Piano, 11 years.</strong> Concert pianist, currently working through Chopin's Ballade No. 4. I play a yearly recital for young kids and teach my younger brother. Practice instrument: a Kawai GL-20 grand.</p>
      <p><strong>Badminton.</strong> Picked it up in 2024, now in the UT Austin badminton club. I studied swing mechanics from first principles (it's mostly forearm pronation) and I'd like to win a collegiate national title before I graduate.</p>
      <p><strong>Also:</strong> IEMs and audio gear, gaming hardware, fragrance, and an embarrassing number of hours in Roblox over the years.</p>
    `
  },
  {
    key: 'occipital', name: 'Occipital lobe', fn: 'vision', section: 'Seen & shown', color: '#c77dff',
    why: 'The occipital lobe is where seeing happens. Rooms I\'ve presented, performed, or built in.',
    html: entries([
      { t: 'DFWIT AI & Startup Competition', m: '2026', p: 'Presented SmartNursingHome, a privacy-first fall detection system. Took home the President Special Award.' },
      { t: 'YC Startup School', m: 'Jul 2026', p: 'Attended in person. It\'s where I met the people who led to my 2026 internships.' },
      { t: 'UNT Scholar\'s Day', m: '2026' },
      { t: 'MIT RAISE AI & Education Summit', m: '2025' },
      { t: 'UNT University Research Day', m: '2025' },
      { t: 'hackTAMS', m: '2025' },
      { t: 'Carnegie Hall', m: 'piano' },
    ])
  },
  {
    key: 'cerebellum', name: 'Cerebellum', fn: 'coordination · practice', section: 'Experience', color: '#7bed9f',
    why: 'The cerebellum refines movement through repetition. Where the practiced work happens.',
    html: entries([
      { t: 'Moonshot (YC S26)', m: 'Jul 2026 – present', role: 'Software Engineering Intern', p: 'Ambient-listening iOS app. Owned real-device reliability for the P0 launch-blocking microphone-persistence issue: diagnosed and fixed Swift audio-session recovery races (one 21-second Bluetooth outage was latching into a 300-second permanent refusal) with regression tests for each. Built a 19-scenario real-hardware evidence rig in Node.js that joins operator actions to the phone\'s own ledger and derives outage duration and recovery latency. Eliminated a quadratic write-ahead-log reconcile that was pinning the app at 82–87% background CPU. 23 merged PRs in the first three weeks.', tags: ['Swift', 'AVAudioSession', 'Node.js', 'TestFlight', 'Release tooling'] },
      { t: 'Stēle', m: 'Jul 2026 – present', role: 'Software Engineering Intern', p: 'Neural-sensing wearable startup. I own the real-time data layer: device-to-backend streaming, session management, buffering, and reconnection under unreliable networks. Consolidated four duplicated log-classification code paths into one shared LLM-powered ingest and edit pipeline (structured parsing with keyword fallback), backed by 78 regression tests. Ship production SwiftUI/SwiftData features: a voice-driven daily check-in, HealthKit integration, shared auth surfaces.', tags: ['SwiftUI', 'SwiftData', 'Real-time', 'HealthKit', 'LLM integration'] },
      { t: 'Texas Christian University', m: 'May 2026 – present', role: 'Software Engineering Consultant', p: 'Sole engineer for HealthLitPro, a production iOS app used daily by physicians at Children\'s Medical Center Dallas: architecture, features, CI/CD, and production reliability. Built the clinical transcription pipeline end to end (AVFoundation capture, async Amazon Transcribe Medical jobs, a custom punctuation-repairing tokenizer), implemented AWS SigV4 signing from scratch in CryptoKit to drop the AWS SDK, and integrated Llama 3 8B for structured health-literacy feedback.', tags: ['SwiftUI', 'AWS', 'CryptoKit', 'Clinical deployment'] },
      { t: 'UNT Vehicle and Edge Computing Lab', m: 'Sep 2024 – May 2026', role: 'Undergraduate Researcher', p: 'Developed the LLM system behind HealthLitPro: an automated audit-and-feedback pipeline that assesses clinician fidelity to health-literacy principles. Fine-tuned Mistral 7B and Llama 3 8B with LoRA on a curated dataset of 212+ annotated healthcare interactions and used RAG to ground feedback in health-literacy guidelines. Co-authored the resulting paper at IEEE/ACM CHASE 2025.', tags: ['PyTorch', 'LoRA', 'RAG', 'Hugging Face', 'Python'] },
    ])
  },
  {
    key: 'brainstem', name: 'Brainstem', fn: 'vital signals', section: 'Contact', color: '#ff5c8a',

        <a href="https://github.com/jw0968" target="_blank" rel="noopener"><span class="k">GitHub</span><span class="v">github.com/jw0968</span></a>
        <a href="https://www.linkedin.com/in/jixin-wang-285853324/" target="_blank" rel="noopener"><span class="k">LinkedIn</span><span class="v">linkedin.com/in/jixin-wang-285853324</span></a>

    `
  },
];

function tags(list, hi) {
  return list.map(t => `<span class="tag${hi.includes(t) ? ' hi' : ''}">${t}</span>`).join('');
}
function entries(list) {
  return '<div class="entries">' + list.map(e => `
    <div class="entry">
      <div class="e-head"><h3>${e.t}${e.pill ? `<span class="pill">${e.pill}</span>` : ''}</h3><span class="meta">${e.m}</span></div>
      ${e.role ? `<div class="role">${e.role}</div>` : ''}
      ${e.p ? `<p>${e.p}</p>` : ''}
      ${e.tags ? `<div class="tags">${tags(e.tags, [])}</div>` : ''}
    </div>`).join('') + '</div>';
}

/* =========================================================
   3D BRAIN — real anatomy
   Cortex: MNI ICBM152 pial surface (81,924 vertices) with AAL atlas labels.
   Cerebellum + brainstem: extracted from the MNI152 2009a template and the
   Diedrichsen (2009) cerebellar atlas (CC BY). Hippocampus: modelled tube at
   its MNI coordinates, drawn x-ray style through the cortex.
   ========================================================= */
const REGION_IDS = { prefrontal: 1, motor: 2, parietal: 3, temporal: 4, occipital: 5, hippocampus: 6, cerebellum: 7, brainstem: 8 };
const ID_TO_KEY = Object.fromEntries(Object.entries(REGION_IDS).map(([k, v]) => [v, k]));
const byKey = Object.fromEntries(REGIONS.map(r => [r.key, r]));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const MM = 0.0185; // millimetres -> scene units

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.physicallyCorrectLights = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, stage.clientWidth / stage.clientHeight, 0.1, 100);
camera.position.set(0, 0.55, 7.4);
camera.lookAt(0, -0.05, 0);

scene.add(new THREE.HemisphereLight(0x8fa3ff, 0x1a0c12, 0.45));
const keyLight = new THREE.DirectionalLight(0xfff1e0, 2.4); keyLight.position.set(3, 5, 4); scene.add(keyLight);
const spec = new THREE.PointLight(0xffffff, 40, 40, 2); spec.position.set(-2.5, 4.5, 5.5); scene.add(spec);
const rimLight = new THREE.DirectionalLight(0x7f9bff, 1.6); rimLight.position.set(-5, 2, -4); scene.add(rimLight);
const rim2 = new THREE.DirectionalLight(0xff9db4, 0.6); rim2.position.set(5, -1, -5); scene.add(rim2);
const fillLight = new THREE.PointLight(0xff9db4, 12, 30, 2); fillLight.position.set(2, -4, 3); scene.add(fillLight);

const brain = new THREE.Group();
brain.rotation.y = -1.0; brain.rotation.x = 0.12;
scene.add(brain);

/* ---------- decode mesh data ---------- */
function b64ToBytes(s) { const bin = atob(s); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function decodeMesh(d) {
  const p16 = new Int16Array(b64ToBytes(d.pos).buffer);
  const pos = new Float32Array(p16.length);
  // MNI (x right, y anterior, z superior) -> three (x, y up, z toward viewer)
  for (let i = 0; i < p16.length; i += 3) {
    pos[i] = p16[i] * 0.01 * MM; pos[i + 1] = p16[i + 2] * 0.01 * MM; pos[i + 2] = -p16[i + 1] * 0.01 * MM;
  }
  const idxBytes = b64ToBytes(d.idx);
  const idx = d.idx16 ? new Uint16Array(idxBytes.buffer) : new Uint32Array(idxBytes.buffer);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  const ao = new Float32Array(d.n); const aoB = b64ToBytes(d.ao); for (let i = 0; i < d.n; i++) ao[i] = aoB[i] / 255;
  g.setAttribute('ao', new THREE.BufferAttribute(ao, 1));
  g.computeVertexNormals();
  return g;
}
function regionAttribute(d, constant) {
  const a = new Float32Array(d.n);
  if (constant !== undefined) a.fill(constant);
  else { const r = b64ToBytes(d.reg); for (let i = 0; i < d.n; i++) a[i] = r[i]; }
  return new THREE.BufferAttribute(a, 1);
}

/* ---------- tissue material with per-region tint ---------- */
const regionColorsArr = new Array(9).fill(0).map(() => new THREE.Color(0x000000));
REGIONS.forEach(r => regionColorsArr[REGION_IDS[r.key]].set(r.color));
const shared = {
  uHover: { value: -1 }, uSel: { value: -1 }, uTime: { value: 0 },
  uColors: { value: regionColorsArr }, uRestTint: { value: 0.4 },
};
const pickables = [];
function tissueMaterial(baseHex, opts = {}) {
  const m = new THREE.MeshPhysicalMaterial({
    color: baseHex, roughness: opts.roughness ?? 0.42, metalness: 0.0,
    clearcoat: opts.clearcoat ?? 0.55, clearcoatRoughness: 0.32,
    side: THREE.FrontSide,
  });
  m.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, shared);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float region; attribute float ao;
        uniform float uHover; uniform float uSel; uniform vec3 uColors[9]; uniform float uRestTint;
        varying vec3 vTint; varying float vTintAmt; varying float vGlow; varying float vAo;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        int rid = int(region + 0.5);
        vTint = uColors[rid];
        bool hov = abs(region - uHover) < 0.5; bool sel = abs(region - uSel) < 0.5;
        bool anySel = uSel > 0.5;
        float amt = rid == 0 ? 0.0 : uRestTint;
        if (sel) amt = 0.8; else if (hov) amt = 0.7; else if (anySel) amt = 0.14;
        vTintAmt = amt;
        vGlow = sel ? 0.55 : (hov ? 0.4 : 0.0);
        vAo = ao;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vTint; varying float vTintAmt; varying float vGlow; varying float vAo;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float occ = mix(0.3, 1.0, smoothstep(0.0, 1.0, vAo));
        diffuseColor.rgb = mix(diffuseColor.rgb, vTint * 0.8, vTintAmt) * occ;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += vTint * vGlow * (0.55 + 0.45 * vAo);`);
  };
  m.customProgramCacheKey = () => 'tissue';
  return m;
}

// picking material: writes region id into the red channel (flat, so boundaries don't blend)
const isGL2 = renderer.capabilities.isWebGL2;
const pickMaterial = new THREE.ShaderMaterial(isGL2 ? {
  glslVersion: THREE.GLSL3,
  vertexShader: 'in float region; flat out float vR; void main(){ vR = region; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'flat in float vR; out vec4 outColor; void main(){ outColor = vec4(vR/255.0, 0.0, 0.0, 1.0); }',
} : {
  vertexShader: 'attribute float region; varying float vR; void main(){ vR = region; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying float vR; void main(){ gl_FragColor = vec4(floor(vR + 0.5)/255.0, 0.0, 0.0, 1.0); }',
});
const pickMaterialXray = pickMaterial.clone(); pickMaterialXray.depthTest = false;

const D = window.BRAIN_DATA;
if (!D) { const m = document.createElement('p'); m.style.cssText = 'position:fixed;inset:auto 0 50% 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px'; m.textContent = 'Brain model data did not load. Reload the page to try again.'; document.body.appendChild(m); throw new Error('BRAIN_DATA missing'); }
const cortexGeo = decodeMesh(D.cortex); cortexGeo.setAttribute('region', regionAttribute(D.cortex));
const cerebGeo = decodeMesh(D.cerebellum); cerebGeo.setAttribute('region', regionAttribute(D.cerebellum, REGION_IDS.cerebellum));
const stemGeo = decodeMesh(D.brainstem); stemGeo.setAttribute('region', regionAttribute(D.brainstem, REGION_IDS.brainstem));

const cortex = new THREE.Mesh(cortexGeo, tissueMaterial(0xb9837f));
const cerebellum = new THREE.Mesh(cerebGeo, tissueMaterial(0xad807e, { roughness: 0.48 }));
const brainstem = new THREE.Mesh(stemGeo, tissueMaterial(0xc39a90, { roughness: 0.5, clearcoat: 0.4 }));
[cortex, cerebellum, brainstem].forEach(m => { brain.add(m); pickables.push(m); });

// Hippocampus: a curved body at its MNI coordinates inside each temporal lobe, drawn through the cortex
const hippoGroup = new THREE.Group(); brain.add(hippoGroup);
[1, -1].forEach(s => {
  const mni = [[26, -8, -22], [31, -18, -16], [31, -28, -10], [27, -37, -2], [22, -42, 6]]; // head -> tail, mm
  const pts = mni.map(([x, y, z]) => new THREE.Vector3(s * x * MM, z * MM, -y * MM));
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 48, 4.6 * MM, 16, false);
  // taper toward the tail
  const p = geo.attributes.position; const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    const t = Math.floor(i / 17) / 48; v.fromBufferAttribute(p, i);
    const c = curve.getPoint(Math.min(t, 1)); v.sub(c).multiplyScalar(1.15 - 0.55 * t).add(c); p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color: 0xff9a1f, emissive: 0xffa53a, emissiveIntensity: 0.6, roughness: 0.5, transparent: true, opacity: 0.6, depthTest: false, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat); mesh.renderOrder = 10; mesh.userData.hippo = true;
  geo.setAttribute('region', new THREE.BufferAttribute(new Float32Array(p.count).fill(REGION_IDS.hippocampus), 1));
  hippoGroup.add(mesh); pickables.push(mesh);
});
const hippoGlowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,0.7)'); g.addColorStop(0.4, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
})();
const hippoGlows = [1, -1].map(s => {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: hippoGlowTex, color: 0xffb84d, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false }));
  sp.position.set(s * 28 * MM, -12 * MM, 24 * MM); sp.scale.set(1.1, 1.1, 1); sp.renderOrder = 11; hippoGroup.add(sp); return sp;
});

brain.position.y = 0.05;

// faint dust
const P = 360, pgeo = new THREE.BufferGeometry(), parr = new Float32Array(P * 3);
for (let i = 0; i < P; i++) { const r = 2.6 + Math.random() * 3.4, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1); parr[i * 3] = r * Math.sin(ph) * Math.cos(th); parr[i * 3 + 1] = r * Math.cos(ph) * 0.7; parr[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th); }
pgeo.setAttribute('position', new THREE.BufferAttribute(parr, 3));
const particles = new THREE.Points(pgeo, new THREE.PointsMaterial({ size: 0.018, color: 0x9fb0ff, transparent: true, opacity: 0.35, depthWrite: false }));
scene.add(particles);

/* ---------- GPU picking ---------- */
const pickTarget = new THREE.WebGLRenderTarget(1, 1);
const pickPixel = new Uint8Array(4);
const pickScene = new THREE.Scene();
const pickMeshes = pickables.map(m => { const pm = new THREE.Mesh(m.geometry, m.userData.hippo ? pickMaterialXray : pickMaterial); pm.renderOrder = m.userData.hippo ? 10 : 0; return pm; });
pickMeshes.forEach(pm => pickScene.add(pm));
function pickAt(px, py) {
  // keep pick meshes in sync with the visible brain transform
  pickables.forEach((m, i) => { m.updateWorldMatrix(true, false); pickMeshes[i].matrixAutoUpdate = false; pickMeshes[i].matrix.copy(m.matrixWorld); pickMeshes[i].matrixWorld.copy(m.matrixWorld); });
  const w = renderer.domElement.width, h = renderer.domElement.height, dpr = renderer.getPixelRatio();
  camera.setViewOffset(w, h, Math.floor(px * dpr), Math.floor(py * dpr), 1, 1);
  renderer.setRenderTarget(pickTarget);
  renderer.setClearColor(0x000000, 1);
  renderer.render(pickScene, camera);
  renderer.readRenderTargetPixels(pickTarget, 0, 0, 1, 1, pickPixel);
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 0);
  camera.clearViewOffset();
  const id = pickPixel[0];
  return ID_TO_KEY[id] || null;
}

/* ---------- interaction ---------- */
let pointerPx = { x: 0, y: 0 };
let hovered = null, selected = null, needPick = false, pointerInside = false;
let dragging = false, dragMoved = false, last = { x: 0, y: 0 }, vel = { x: 0, y: 0 };
const canvas = renderer.domElement;

canvas.addEventListener('pointermove', e => {
  pointerPx = { x: e.clientX, y: e.clientY }; pointerInside = true;
  if (dragging) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
    brain.rotation.y += dx * 0.006; brain.rotation.x = clamp(brain.rotation.x + dy * 0.004, -0.9, 0.9);
    vel = { x: dx * 0.006, y: dy * 0.004 };
    last = { x: e.clientX, y: e.clientY };
  } else needPick = true;
});
canvas.addEventListener('pointerdown', e => { dragging = true; dragMoved = false; last = { x: e.clientX, y: e.clientY }; vel = { x: 0, y: 0 }; canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', e => {
  dragging = false; canvas.classList.remove('dragging');
  if (!dragMoved) { const k = pickAt(e.clientX, e.clientY); if (k) select(k); else if (selected) closePanel(); }
});
canvas.addEventListener('pointerleave', () => { pointerInside = false; setHover(null); });
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

const tooltip = document.getElementById('tooltip');
function setHover(k) {
  if (k === hovered) return;
  hovered = k;
  canvas.classList.toggle('hovering', !!k);
  if (k) {
    const r = byKey[k];
    tooltip.style.setProperty('--c', r.color);
    tooltip.querySelector('.t-name').textContent = r.name;
    tooltip.querySelector('.t-sub').textContent = r.fn;
    tooltip.querySelector('.t-sec').textContent = r.section;
    tooltip.classList.add('show');
  } else tooltip.classList.remove('show');
}

/* ---------- panel + index ---------- */
const panel = document.getElementById('panel'), scrim = document.getElementById('scrim');
const indexEl = document.getElementById('index');
indexEl.innerHTML = '<div class="label">Regions</div>' + REGIONS.map(r => `
  <button type="button" data-key="${r.key}" style="--c:${r.color}">
    <span class="dot"></span>
    <span><span class="name">${r.section}</span><span class="fn">${r.name}</span></span>
  </button>`).join('');
indexEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(b.dataset.key); });
let indexHover = null;
indexEl.addEventListener('pointerover', e => { const b = e.target.closest('button'); if (b) indexHover = b.dataset.key; });
indexEl.addEventListener('pointerout', e => { if (!indexEl.contains(e.relatedTarget)) indexHover = null; });

function select(k) {
  selected = k;
  const r = byKey[k];
  panel.style.setProperty('--c', r.color);
  document.getElementById('panel-eyebrow').textContent = `${r.name} · ${r.fn}`;
  document.getElementById('panel-title').textContent = r.section;
  document.getElementById('panel-why').textContent = r.why;
  document.getElementById('panel-body').innerHTML = r.html;
  document.getElementById('panel-body').scrollTop = 0;
  panel.classList.add('open'); scrim.classList.add('show');
  indexEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.key === k));
}
function closePanel() {
  selected = null;
  panel.classList.remove('open'); scrim.classList.remove('show');
  indexEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
}
document.getElementById('panel-close').addEventListener('click', closePanel);
scrim.addEventListener('click', closePanel);
window.addEventListener('keydown', e => { if (e.key === 'Escape' && selected) closePanel(); });

/* ---------- render loop ---------- */
const clock = new THREE.Clock();
let lastPickTime = 0;
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (pointerInside && !dragging && (needPick || t - lastPickTime > 0.2) && t - lastPickTime > 0.04) { needPick = false; lastPickTime = t; setHover(pickAt(pointerPx.x, pointerPx.y)); }
  if (hovered) { tooltip.style.left = pointerPx.x + 'px'; tooltip.style.top = pointerPx.y + 'px'; }

  if (!dragging) {
    if (!reduceMotion) brain.rotation.y += (selected ? 0.0005 : 0.0018) + vel.x;
    brain.rotation.x += vel.y; brain.rotation.x = clamp(brain.rotation.x, -0.9, 0.9);
    vel.x *= 0.92; vel.y *= 0.92;
  }
  if (!reduceMotion) { particles.rotation.y = t * 0.02; }

  // Slide the brain out from under the panel (sideways on desktop, upward on phones)
  const narrow = window.innerWidth <= 720;
  const tx = selected && !narrow ? -1.15 : 0, ty = selected && narrow ? 1.25 : 0.05;
  brain.position.x += (tx - brain.position.x) * (reduceMotion ? 1 : 0.08);
  brain.position.y += (ty - brain.position.y) * (reduceMotion ? 1 : 0.08);

  const active = hovered || indexHover;
  shared.uHover.value = active ? REGION_IDS[active] : -1;
  shared.uSel.value = selected ? REGION_IDS[selected] : -1;
  shared.uTime.value = t;

  const hActive = active === 'hippocampus', hSel = selected === 'hippocampus';
  const hDim = selected && !hSel && !hActive ? 0.45 : 1;
  const eTarget = (hSel ? 1.3 : hActive ? 1.1 : 0.6 + 0.12 * Math.sin(t * 1.5)) * hDim;
  hippoGroup.children.forEach(c => {
    if (c.isSprite) c.material.opacity += (((hSel ? 0.5 : hActive ? 0.42 : 0.22) * hDim) - c.material.opacity) * 0.1;
    else c.material.emissiveIntensity += (eTarget - c.material.emissiveIntensity) * 0.1;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
